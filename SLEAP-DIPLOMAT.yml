# SLEAP-DIPLOMAT.yml
name: sleap-diplomat
channels:
  - conda-forge
  - nvidia
  - sleap/label/dev
  - sleap
  - anaconda
dependencies:
  - python=3.9
  - pip
  - sleap>=1.2.3
  - typing-extensions=3.10.0.2  # Explicitly pin the version
  - numpy<1.25.0  # Add numpy version constraint if needed
  - pandas
  - matplotlib
  - scikit-learn
  - opencv
  - pip:
    - diplomat-track[gui]
    - jupyter
    - jupyterlab
    - jupyter-server-proxy
